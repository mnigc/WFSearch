[workspace]
resolver = "2"
members = [
    "crates/wfs-proto",
    "crates/wfs-core",
    "crates/wfs-fs",
    "crates/wfs-server",
    "crates/wfs-client",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
rayon = "1"
ahash = { version = "0.8", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
axum = "0.8"
windows-service = "0.8"
clap = { version = "4", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
anyhow = "1"
criterion = "0.5"
wfs-proto = { path = "crates/wfs-proto" }
wfs-core = { path = "crates/wfs-core" }
wfs-fs = { path = "crates/wfs-fs" }
wfs-client = { path = "crates/wfs-client" }

[profile.release]
lto = "thin"
codegen-units = 1
