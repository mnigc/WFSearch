[package]
name = "wfs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WFSearch Windows service: named pipe + local HTTP front for the index engine"

[[bin]]
name = "wfs-server"
path = "src/main.rs"

[dependencies]
wfs-core = { workspace = true }
wfs-proto = { workspace = true }
wfs-fs = { workspace = true }
wfs-content = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows-service = { workspace = true }
clap = { workspace = true }
bincode = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# the end-to-end tests drive the real transports through the public SDK
wfs-client = { workspace = true }
# content-search tests build real OOXML fixtures
zip = { workspace = true }
